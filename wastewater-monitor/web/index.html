<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wastewater Flow Monitor</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17202a;background:#f4f7f9}
body{margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid #dce3e8;border-radius:16px;padding:18px;margin:12px 0}
.big{font-size:clamp(42px,10vw,76px);font-weight:750}.muted{color:#68737d}.ok{color:#087a55;font-weight:700}.bad{color:#b42318;font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e6eaed;text-align:left}
canvas{width:100%;height:250px}.center{text-align:center}
@media(max-width:650px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><h2>Wastewater Flow Monitor</h2><div class="muted">WWTP-FLOW-01</div></div><div id="status" class="bad">CONNECTING</div></div>
  <section class="card center"><div class="muted">FLOW REAL-TIME</div><div><span id="flow" class="big">--</span> m³/h</div><div id="updated" class="muted">รอข้อมูล...</div></section>
  <div class="grid">
    <section class="card"><div class="muted">ค่าเฉลี่ย 24 ชม.</div><h2 id="avg">--</h2><div>m³/h</div></section>
    <section class="card"><div class="muted">ค่าสูงสุด 24 ชม.</div><h2 id="max">--</h2><div>m³/h</div></section>
    <section class="card"><div class="muted">จำนวนข้อมูล</div><h2 id="count">--</h2><div>records</div></section>
  </div>
  <section class="card"><h3>Flow 24 ชั่วโมงล่าสุด</h3><canvas id="chart" width="850" height="250"></canvas></section>
  <section class="card"><h3>ข้อมูลล่าสุด</h3><table><thead><tr><th>เวลา</th><th>Flow (m³/h)</th></tr></thead><tbody id="rows"></tbody></table></section>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
